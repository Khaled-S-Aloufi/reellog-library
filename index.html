title='ReelLog — '+t('account');document.getElementById('lang').textContent=lang==='en'?'عربي':'English';document.getElementById('eyebrow').textContent=t('eyebrow');document.getElementById('greeting').textContent=t('welcome');document.getElementById('subtitle').textContent=t('sub');document.getElementById('addBtn').textContent=t('add');document.getElementById('footnote').textContent=t('logged');document.getElementById('topAvatar').innerHTML=data.user.photo?`<img class="avatar" src="${data.user.photo}">`:(data.user.name||'?').slice(0,1).toUpperCase();let finished=data.items.filter(x=>x.status==='Finished').length,active=data.items.filter(x=>['Watching','Playing','Listening'].includes(x.status)).length,ratings=data.items.filter(x=>x.rating>0),avg=ratings.length?(ratings.reduce((s,x)=>s+x.rating,0)/ratings.length).toFixed(1):'—';document.getElementById('stats').innerHTML=[[t('total'),data.items.length,'▣'],[t('finished'),finished,'✓'],[t('playing'),active,'◷'],[t('rated'),avg==='—'?'—':avg+' / 5','★']].map(a=>`<div class="stat"><div class="label">${a[0]}</div><strong><i>${a[2]}</i>${a[1]}</strong></div>`).join('');let nav=[['all','◈'],...types.map(x=>[x,emojis[x]])];document.getElementById('nav').innerHTML=nav.map(([k,ic])=>`<button data-view="${k}" class="${view===k?'active':''}"><span>${ic}</span>${t(k)}</button>`).join('');document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{view=b.dataset.view;render()});let profile=view==='profile',items=data.items.filter(x=>(view==='all'||view==='favorites'||types.includes(view)&&x.type===view)&&(view!=='favorites'||x.fav)&& (filter==='all'||x.status===filter)&&(`${x.title} ${x.by} ${x.genre}`.toLowerCase().includes(query.toLowerCase()))).sort((a,b)=>b.created-a.created);document.getElementById('viewTitle').textContent=profile?t('profile'):view==='favorites'?t('favorites'):view==='all'?t('recent'):t(view);document.getElementById('toolbar').style.display=profile?'none':'flex';document.getElementById('toolbar').innerH
